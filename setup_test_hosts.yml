---
# Creates the Zabbix host objects referenced in map_hosts.yaml.
# Uses httpapi (the pattern from ansible-zabbix) — run against ZABBIX_API group.
# zabbix_server_ip must be passed on the command line: -e zabbix_server_ip=X.X.X.X

- name: Register test hosts in Zabbix
  hosts: ZABBIX_API
  gather_facts: false

  tasks:
    - name: Ensure host groups exist
      community.zabbix.zabbix_group:
        host_groups:
          - "Linux servers"
          - "Zabbix servers"
          - "Zabbix proxy groups"
          - "Virtual IPs"
        state: present

    # Real hosts — point at the Lima VM IP so Zabbix can reach them
    - name: Register db-zabbix-01 (simulated PostgreSQL host)
      community.zabbix.zabbix_host:
        host_name:    "db-zabbix-01"
        visible_name: "PostgreSQL (test)"
        host_groups:
          - "Linux servers"
        link_templates:
          - "Linux by Zabbix agent"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ zabbix_server_ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present

    - name: Register zabbix-server-01
      community.zabbix.zabbix_host:
        host_name:    "zabbix-server-01"
        visible_name: "Zabbix Server (test)"
        host_groups:
          - "Zabbix servers"
        link_templates:
          - "Zabbix server health"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ zabbix_server_ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present

    # Placeholder template — "Zabbix proxy group health" doesn't exist in the
    # Zabbix 7.4 default template set, so the original post's example can't
    # link to it as written. Created here as an empty template purely so
    # link_templates can still be exercised on the proxy dummy hosts below.
    - name: Ensure "Zabbix proxy group health" template exists
      community.zabbix.zabbix_template:
        template_name: "Zabbix proxy group health"
        template_groups:
          - "Templates"
        state: present

    # Earlier topology iterations registered these under different names
    # (proxy-group-cph / proxy-group-aar). The VM persists across runs, so a
    # straight rename in the loop below would leave the old hosts as orphans —
    # remove them explicitly first.
    - name: Remove superseded proxy host names from earlier topology iterations
      community.zabbix.zabbix_host:
        host_name: "{{ item }}"
        state: absent
      loop:
        - "proxy-group-cph"
        - "proxy-group-aar"
      ignore_errors: true

    # Proxy dummy hosts — visual stand-ins for the real zabbix-proxy daemons.
    # Zabbix maps can only reference host/hostgroup/map/trigger/image elements,
    # never Proxy objects directly, so each real proxy needs a same-named dummy
    # host purely so the map has something to point at (see the "Proxy 01" /
    # "Proxy 02" elements in map_hosts.yaml / maps_custom.yaml). The actual
    # daemons are provisioned and registered as Proxy objects — assigned to the
    # "zabbix-maps-test" proxy group — by provision_zabbix_proxies.yml. These
    # dummy hosts deliberately carry no monitored_by/proxy_group of their own:
    # a placeholder representing a proxy shouldn't be monitored by the very
    # group it represents.
    - name: Register proxy dummy hosts
      community.zabbix.zabbix_host:
        host_name:    "{{ item.host }}"
        visible_name: "{{ item.label }}"
        host_groups:
          - "Zabbix proxy groups"
        link_templates:
          - "Zabbix proxy group health"
        # Explicit zabbix_server (rather than omitting monitored_by) — the
        # module preserves whatever's already set when this is left out, and
        # earlier runs left these pointed at proxy_group/zabbix-maps-test.
        monitored_by: zabbix_server
        status: enabled
        state:  present
      loop:
        - { host: "proxy01", label: "Proxy 01" }
        - { host: "proxy02", label: "Proxy 02" }

    # VIP dummy hosts — ICMP interface at non-routable test IPs (will always be down)
    - name: Register VIP dummy hosts
      community.zabbix.zabbix_host:
        host_name:    "{{ item.host }}"
        visible_name: "{{ item.label }}"
        host_groups:
          - "Virtual IPs"
        link_templates:
          - "ICMP Ping"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ item.ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present
      loop:
        - { host: "vip-lb-prod",  label: "VIP LB Prod",  ip: "10.0.0.10" }
        - { host: "vip-api-prod", label: "VIP API Prod",  ip: "10.0.0.11" }
