---
# Creates the Zabbix host objects referenced in map_hosts.yaml.
# Uses httpapi (the pattern from ansible-zabbix) — run against ZABBIX_API group.
# zabbix_server_ip must be passed on the command line: -e zabbix_server_ip=X.X.X.X

- name: Register test hosts in Zabbix
  hosts: ZABBIX_API
  gather_facts: false

  tasks:
    - name: Ensure host groups exist
      community.zabbix.zabbix_group:
        host_groups:
          - "Linux servers"
          - "Zabbix servers"
          - "Zabbix proxy groups"
          - "Virtual IPs"
        state: present

    # Real hosts — point at the Lima VM IP so Zabbix can reach them
    - name: Register db-zabbix-01 (simulated PostgreSQL host)
      community.zabbix.zabbix_host:
        host_name:    "db-zabbix-01"
        visible_name: "PostgreSQL (test)"
        host_groups:
          - "Linux servers"
        link_templates:
          - "Linux by Zabbix agent"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ zabbix_server_ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present

    - name: Register zabbix-server-01
      community.zabbix.zabbix_host:
        host_name:    "zabbix-server-01"
        visible_name: "Zabbix Server (test)"
        host_groups:
          - "Zabbix servers"
        link_templates:
          - "Zabbix server health"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ zabbix_server_ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present

    # Placeholder template — "Zabbix proxy group health" doesn't exist in the
    # Zabbix 7.4 default template set, so the original post's example can't
    # link to it as written. Created here as an empty template purely so
    # link_templates / monitored_by / proxy_group can be exercised end to end.
    - name: Ensure "Zabbix proxy group health" template exists
      community.zabbix.zabbix_template:
        template_name: "Zabbix proxy group health"
        template_groups:
          - "Templates"
        state: present

    - name: Ensure "zabbix-maps-test" proxy group exists
      community.zabbix.zabbix_proxy_group:
        name: "zabbix-maps-test"
        description: "Placeholder proxy group for zabbix-maps-as-code testing"
        state: present

    # Proxy group dummy hosts — no agent interface, represent proxy groups on
    # the map. Both are monitored via the single test proxy group above, which
    # exercises the monitored_by / proxy_group parameters from the original post
    # (that example was missing monitored_by and pointed at proxy groups that
    # don't exist — both gaps are closed here).
    - name: Register proxy group dummy hosts
      community.zabbix.zabbix_host:
        host_name:    "{{ item.host }}"
        visible_name: "{{ item.label }}"
        host_groups:
          - "Zabbix proxy groups"
        link_templates:
          - "Zabbix proxy group health"
        monitored_by: proxy_group
        proxy_group:  "zabbix-maps-test"
        status: enabled
        state:  present
      loop:
        - { host: "proxy-group-cph", label: "Proxy Group CPH" }
        - { host: "proxy-group-aar", label: "Proxy Group AAR" }

    # VIP dummy hosts — ICMP interface at non-routable test IPs (will always be down)
    - name: Register VIP dummy hosts
      community.zabbix.zabbix_host:
        host_name:    "{{ item.host }}"
        visible_name: "{{ item.label }}"
        host_groups:
          - "Virtual IPs"
        link_templates:
          - "ICMP Ping"
        interfaces:
          - type:  agent
            main:  true
            useip: true
            ip:    "{{ item.ip }}"
            dns:   ""
            port:  "10050"
        status: enabled
        state:  present
      loop:
        - { host: "vip-lb-prod",  label: "VIP LB Prod",  ip: "10.0.0.10" }
        - { host: "vip-api-prod", label: "VIP API Prod",  ip: "10.0.0.11" }
