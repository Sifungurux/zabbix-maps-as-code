[localhost]
localhost ansible_connection=local

# httpapi — used by setup_test_hosts.yml and create_zabbix_maps.yml
# Separate host alias so ZABBIX_SERVER:vars don't bleed in.
[ZABBIX_API]
zabbix-maps-api ansible_host=192.168.105.9

[ZABBIX_API:vars]
ansible_connection=httpapi
ansible_network_os=community.zabbix.zabbix
ansible_user=Admin
ansible_httpapi_port=80
ansible_httpapi_use_ssl=false
ansible_httpapi_validate_certs=false
ansible_password=zabbix

# SSH — used by provision_zabbix.yml only
# Different host alias so httpapi vars don't bleed in.
[ZABBIX_SERVER]
zabbix-maps-ssh ansible_host=192.168.105.9

[ZABBIX_SERVER:vars]
ansible_connection=ssh
ansible_user=kirk
ansible_ssh_private_key_file=/Users/kirk/.lima/_config/user
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
